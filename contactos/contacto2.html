<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario MINIGO</title>
    <link rel="stylesheet" href="formulario.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Quicksand:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <section class="form-container">

        <!-- Imagen decorativa -->
        <img src="img/minigo-form-banner.png" class="banner-img" alt="MINIGO Ofertas">

        <!-- Logo MINIGO -->
        <div class="logo-minigo">
            <svg width="70" height="70" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#E63946" />
                <path d="M30 52 L45 67 L72 35"
                      stroke="#FFFFFF"
                      stroke-width="10"
                      fill="none"
                      stroke-linecap="round"
                      stroke-linejoin="round" />
            </svg>

            <h1>MINIGO</h1>
            <p class="subtitulo">Cotiza, consulta y recibe ofertas exclusivas</p>
        </div>

        <!-- Formulario -->
        <form class="form-minigo">

            <label for="nombre">Nombre (opcional)</label>
            <input type="text" id="nombre" placeholder="Tu nombre">

            <label for="email">Correo electrónico *</label>
            <input type="email" id="email" placeholder="ejemplo@gmail.com" required>

            <label for="mensaje">Mensaje o cotización *</label>
            <textarea id="mensaje" placeholder="Escribe tu consulta o cotización aquí..." required></textarea>

            <div class="checkbox-area">
                <input type="checkbox" id="suscripcion">
                <label for="suscripcion">Deseo recibir ofertas y descuentos MINIGO</label>
            </div>

            <button type="submit">
                Enviar mensaje
            </button>

            </di
        </form>

        <p id="mostrar_mensaje"></p>
    </section>
    <script type= "module" src="js/firebase.js"></script>"

    </div>

</body>
</html>
